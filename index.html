<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Il Messaggero di Goldoni</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
    background-color: #e5ddd5;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
  }

  .chat-container {
    width: 100%;
    max-width: 480px;
    height: 100vh;
    max-height: 800px;
    background: #e5ddd5;
    display: flex;
    flex-direction: column;
    box-shadow: 0 4px 24px rgba(0,0,0,0.2);
    position: relative;
    overflow: hidden;
  }

  /* HEADER */
  .chat-header {
    background: #075e54;
    color: white;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-shrink: 0;
    z-index: 10;
  }

  .avatar {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    object-fit: cover;
    object-position: center top;
    border: 2px solid rgba(255,255,255,0.3);
    flex-shrink: 0;
    background: #128c7e;
  }

  .avatar-fallback {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: #128c7e;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    font-weight: bold;
    color: white;
    flex-shrink: 0;
    border: 2px solid rgba(255,255,255,0.3);
  }

  .header-info { flex: 1; }
  .header-name { font-size: 16px; font-weight: 600; }
  .header-status { font-size: 12px; color: rgba(255,255,255,0.75); }

    background: #ffffff;
    color: #111;
    align-self: flex-start;
    border-top-left-radius: 0;
    margin-left: 4px;
  }

  .bubble-outgoing {
    background: #dcf8c6;
    color: #111;
    align-self: flex-end;
    border-top-right-radius: 0;
    margin-right: 4px;
  }

  .bubble-time {
    font-size: 11px;
    color: #999;
    float: right;
    margin-left: 8px;
    margin-top: 2px;
  }

  /* TYPING INDICATOR */
  .typing-bubble {
    background: #ffffff;
    align-self: flex-start;
    border-radius: 8px;
    border-top-left-radius: 0;
    padding: 10px 14px;
    display: flex;
    align-items: center;
    gap: 5px;
    animation: fadeInUp 0.2s ease;
    margin-left: 4px;
  }

  .typing-dot {
    width: 8px;
    height: 8px;
    background: #aaa;
    border-radius: 50%;
    animation: typingBounce 1.2s infinite;
  }
  .typing-dot:nth-child(2) { animation-delay: 0.2s; }
  .typing-dot:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); }
    30% { transform: translateY(-5px); }
  }

  /* INPUT AREA */
  .input-area {
    background: #f0f0f0;
    padding: 8px 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    flex-shrink: 0;
  }

  .input-area input {
    flex: 1;
    border: none;
    border-radius: 24px;
    padding: 10px 16px;
    font-size: 15px;
    outline: none;
    background: white;
    color: #111;
    font-family: inherit;
  }

  .input-area input::placeholder { color: #999; }

  .send-btn {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #075e54;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
    transition: background 0.15s;
  }

  .send-btn:hover { background: #128c7e; }
  .send-btn svg { fill: white; width: 22px; height: 22px; }

  /* CLOSE BUTTON */
  .close-btn {
    width: 100%;
    padding: 12px;
    background: #075e54;
    color: rgba(255,255,255,0.75);
    border: none;
    font-size: 14px;
    font-weight: 400;
    cursor: default;
    font-family: inherit;
    flex-shrink: 0;
    pointer-events: none;
    display: none;
  }
  .close-btn.visible { display: block; }

  /* ERROR bubble */
  .bubble-error {
    background: #fff3cd;
    color: #666;
    font-style: italic;
    font-size: 13.5px;
  }

  .date-separator {
    text-align: center;
    margin: 8px 0;
    font-size: 12px;
    color: #444;
    background: rgba(255,255,255,1);
    border-radius: 8px;
    padding: 3px 10px;
    align-self: center;
  }
</style>
</head>
<body>
<div class="chat-container">

  <div class="chat-header">
    <img class="avatar" id="goldoni-avatar"
    src="goldoni.jpg"
      alt="Carlo Goldoni"
      onerror="this.style.display='none'; document.getElementById('avatar-fallback').style.display='flex';"
    >
    <div class="avatar-fallback" id="avatar-fallback" style="display:none;">CG</div>
    <div class="header-info">
      <div class="header-name">Carlo Goldoni</div>
      <div class="header-status" id="status-text">offline</div>
    </div>
  </div>

  <div class="messages-area" id="messages-area">
    <div class="date-separator">oggi</div>
  </div>

  <div class="input-area" id="input-area">
    <input type="text" id="user-input" placeholder="Scrivi un messaggio…" autocomplete="off" />
    <button class="send-btn" id="send-btn" aria-label="Invia">
      <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
    </button>
  </div>

  <button class="close-btn" id="close-btn">Chiudi questa scheda per tornare al gioco</button>

</div>

<script>
const messagesArea = document.getElementById('messages-area');
const userInput = document.getElementById('user-input');
const sendBtn = document.getElementById('send-btn');
const statusText = document.getElementById('status-text');
const closeBtn = document.getElementById('close-btn');
const inputArea = document.getElementById('input-area');

let step = 0;
let busy = false;

const chat1 = [
  "Gentilissimi viaggiatori, finalmente siete pervenuti a stabilir contatto!",
  "Da qualche tempo vi tengo d'occhio, e m'è venuta la fantasia di prestarvi soccorso.",
  "Confesso, però, ch'io non son pratico di coteste moderne invenzioni (diaboliche, oso dire) ond'è ch'io mi terrò breve.",
  "Ma prima, vi prego, levatemi una curiosità: che sorta di cavallo di ferro adoperate mai per i vostri spostamenti?"
];

const chat2 = [
  "E come diavolo fate a reggervi in equilibrio sopra di esso?",
  "Pure, lasciando da parte tal maraviglia, so ben io quale sia la vostra prossima meta: vi parrà luogo asciutto e privo d'acqua… e nondimeno ella vi si trova assai vicina!",
  "Ora vi debbo abbandonare, ché mi convien terminare la mia <em>Trilogia della villeggiatura</em>.",
  "Vi auguro ogni fortuna… e che il cielo vi accompagni!"
];

const keywords1 = ['dolo', 'squero'];
const keywords2 = ['bicicletta', 'bici'];
const bikePattern = /\b(bike|e-bike|ebike)\b/;

function matchesKeywords(text, keywords, extraPattern) {
  for (const k of keywords) {
    const re = new RegExp('\\b' + k + '\\b');
    if (re.test(text)) return true;
  }
  if (extraPattern && extraPattern.test(text)) return true;
  return false;
}

function getTime() {
  const now = new Date();
  return now.getHours().toString().padStart(2,'0') + ':' + now.getMinutes().toString().padStart(2,'0');
}

function addBubble(text, type, showTime) {
  const div = document.createElement('div');
  div.className = 'bubble ' + (type === 'out' ? 'bubble-outgoing' : 'bubble-incoming') + (type === 'error' ? ' bubble-error' : '');
  div.innerHTML = text + (showTime !== false ? '<span class="bubble-time">' + getTime() + '</span>' : '');
  messagesArea.appendChild(div);
  messagesArea.scrollTop = messagesArea.scrollHeight;
  return div;
}

function showTyping() {
  const div = document.createElement('div');
  div.className = 'typing-bubble';
  div.id = 'typing';
  div.innerHTML = '<div class="typing-dot"></div><div class="typing-dot"></div><div class="typing-dot"></div>';
  messagesArea.appendChild(div);
  messagesArea.scrollTop = messagesArea.scrollHeight;
  statusText.textContent = 'sta scrivendo…';
}

function hideTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
  statusText.textContent = 'online';
}

function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

async function sendMessages(messages, onDone) {
  busy = true;
  sendBtn.disabled = true;
  userInput.disabled = true;

  for (let i = 0; i < messages.length; i++) {
    showTyping();
    const lineBonus = messages[i].length > 120 ? 2000 : messages[i].length > 60 ? 1000 : 0;
    const typingTime = 3200 + messages[i].length * 18 + lineBonus;
    await delay(Math.min(typingTime, 7200));
    hideTyping();
    addBubble(messages[i], 'in', true);
    if (i < messages.length - 1) await delay(600);
  }

  busy = false;
  sendBtn.disabled = false;
  userInput.disabled = false;
  userInput.focus();
  if (onDone) onDone();
  if (step !== 2) scheduleOffline();
}

let offlineTimer = null;

function scheduleOffline() {
  if (offlineTimer) clearTimeout(offlineTimer);
  offlineTimer = setTimeout(() => {
    statusText.textContent = 'offline';
  }, 10000);
}

function handleInput() {
  if (busy) return;
  const raw = userInput.value.trim();
  if (!raw) return;

  if (offlineTimer) clearTimeout(offlineTimer);

  const text = raw.toLowerCase();
  userInput.value = '';

  addBubble(raw, 'out', true);

  if (step === 0) {
    const match = matchesKeywords(text, keywords1, null);
    if (match) {
      step = 1;
      setTimeout(() => {
        statusText.textContent = 'online';
        setTimeout(() => sendMessages(chat1, () => { scheduleOffline(); }), 1000);
      }, 5000);
    } else {
      setTimeout(() => {
        statusText.textContent = 'online';
        setTimeout(() => {
          addBubble('Messere, io non vi conosco affatto, volete dirmi qualcosa?', 'in error', true);
          scheduleOffline();
        }, 600);
      }, 5000);
    }
  } else if (step === 1) {
    const match = matchesKeywords(text, keywords2, bikePattern);
    if (match) {
      step = 2;
      setTimeout(() => {
        statusText.textContent = 'online';
        setTimeout(() => sendMessages(chat2, () => {
          inputArea.style.display = 'none';
          closeBtn.classList.add('visible');
          statusText.textContent = 'offline';
        }), 1000);
      }, 5000);
    } else {
      setTimeout(() => {
        statusText.textContent = 'online';
        setTimeout(() => {
          addBubble('Perdonatemi, signori, ma non ho ben compreso ciò che intendete dire.', 'in error', true);
          scheduleOffline();
        }, 600);
      }, 5000);
    }
  }
}

sendBtn.addEventListener('click', handleInput);
userInput.addEventListener('keydown', e => { if (e.key === 'Enter') handleInput(); });
</script>
</body>
</html>
